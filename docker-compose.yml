version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: peerdrop-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: peerdrop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d peerdrop"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: peerdrop-server
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/peerdrop?schema=public"
      JWT_SECRET: super-secret-peerdrop-jwt-key-change-in-production-2026
      CLIENT_URL: "http://localhost:5173"
    depends_on:
      postgres:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    container_name: peerdrop-client
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  pgdata:
